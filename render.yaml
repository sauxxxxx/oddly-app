# Render Blueprint: creates the ODDLY API from this repository.
# Render → New → Blueprint → pick this repo. Values marked `sync: false` are asked for
# once in Render's dashboard (copy them from backend/.env on the owner's PC — never commit them).
# ODDLY is used through the desktop app; the API also serves its installer and updates.
# Step-by-step guide: docs/DEPLOYMENT.md.

services:
  # API — https://api.workwithoddly.com
  - type: web
    name: oddly-api
    runtime: docker
    # Next to Supabase (eu-west-1): the API makes many database round trips per request.
    region: frankfurt
    # Not the free plan: free instances sleep, which stops reminders and uptime checks.
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    # Only redeploy when the API's code changes.
    buildFilter:
      paths:
        - backend/**
        - Cargo.toml
        - Cargo.lock
        - Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://uevhngxijollpkrkbcwq.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SECRETS_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # The desktop app's origins (Windows/Linux and macOS).
      - key: CORS_ALLOWED_ORIGINS
        value: http://tauri.localhost,tauri://localhost
      - key: TRUST_PROXY
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "600"
      - key: RUST_LOG
        value: oddly_api=info,tower_http=info
