# /etc/nginx/sites-available/scout — ODDLY API, behind nginx with a Let's Encrypt certificate.
server {
    listen 80;
    listen [::]:80;
    server_name scout.remarugsimar.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name scout.remarugsimar.com;

    ssl_certificate /etc/letsencrypt/live/scout.remarugsimar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scout.remarugsimar.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 3m;

    location / {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace, don't append: the API rate-limits on this address, so clients can't fake it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        # AI answers can take a while (the API's own limit is 150 s).
        proxy_read_timeout 170s;
    }
}
